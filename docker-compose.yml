version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - blog-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    networks:
      - blog-network

  # 后端服务
  backend:
    image: ${BACKEND_IMAGE:-blog-backend:latest}
    container_name: blog-backend
    restart: always
    depends_on:
      - mysql
      - redis
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3000
    volumes:
      - backend_uploads:/blog-app/uploads
    ports:
      - "3000:3000"
    networks:
      - blog-network

  # 前端博客
  frontend:
    image: ${FRONTEND_IMAGE:-blog-frontend:latest}
    container_name: blog-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - blog-network

  # 管理后台
  admin:
    image: ${ADMIN_IMAGE:-blog-admin:latest}
    container_name: blog-admin
    restart: always
    depends_on:
      - backend
    ports:
      - "8081:80"
    networks:
      - blog-network

  # Nginx统一网关
  nginx-gateway:
    image: nginx:alpine
    container_name: blog-gateway
    restart: always
    depends_on:
      - frontend
      - admin
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    networks:
      - blog-network

volumes:
  mysql_data:
  redis_data:
  backend_uploads:

networks:
  blog-network:
    driver: bridge
