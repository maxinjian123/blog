services:
  mysql:
    image: mysql:8.0
    container_name: blog-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123}
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - blog-network  # 加入自定义网络

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    # 有密码
    # command: redis-server --appendonly yes --requirepass $REDIS_PASSWORD
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - blog-network  # 加入自定义网络

  backend:
    build: ./backend
    container_name: blog-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blog}
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      DOUBAO_BASE_URL: ${DOUBAO_BASE_URL:-}
      DOUBAO_CHAT_MODEL: ${DOUBAO_CHAT_MODEL:-}
      DOUBAO_IMAGE_MODEL: ${DOUBAO_IMAGE_MODEL:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_CHAT_ENABLED: ${OLLAMA_CHAT_ENABLED:-false}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
    volumes:
      - uploads_data:/blog-app/uploads
      - bakup_data:/blog-app/bakup
      - public_data:/blog-app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - blog-network  # 加入自定义网络

  client:
    image: nginx:alpine
    container_name: blog-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-80}:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/client.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - blog-network  # 加入自定义网络

  admin:
    image: nginx:alpine
    container_name: blog-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-81}:80"
    volumes:
      - ./admin/dist:/usr/share/nginx/html:ro
      - ./nginx/admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - blog-network  # 加入自定义网络

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  bakup_data:
  public_data:

networks:
  blog-network:
    driver: bridge
    name: blog-network  # 指定网络名称，便于外部容器接入
