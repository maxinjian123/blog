<!--
  新文章发布通知 - 正文
  变量：
    - siteName: 站点名称
    - articleTitle: 文章标题
    - articleSummary: 文章摘要（可空）
    - articleUrl: 文章链接
    - unsubscribeUrl: 取消订阅链接
-->
<div style="text-align:center;margin:0 0 16px 0">
  <div style="display:inline-block;background:linear-gradient(135deg,#ff8a65,#ffb74d);color:#fff;padding:4px 14px;border-radius:999px;font-size:12px;font-weight:600">📝 新文章</div>
</div>
<p style="color:#5d4037;font-size:15px;line-height:1.7;margin:0 0 8px 0">
  你订阅的 <strong style="color:#ff7043">{{siteName}}</strong> 发布了新文章：
</p>
<h2 style="color:#3e2723;font-size:20px;line-height:1.5;margin:0 0 16px 0;font-weight:600">《{{articleTitle}}》</h2>
{{#if articleSummary}}
<div style="background:#fff3e0;padding:16px 18px;border-radius:8px;margin:0 0 20px 0;border-left:3px solid #ffb74d">
  <p style="color:#5d4037;font-size:14px;line-height:1.7;margin:0">{{articleSummary}}</p>
</div>
{{/if}}
<div style="text-align:center;margin:24px 0">
  <a href="{{articleUrl}}" style="display:inline-block;background:linear-gradient(135deg,#ff8a65,#ffb74d);color:#fff;padding:14px 36px;text-decoration:none;font-size:15px;border-radius:999px;font-weight:600;box-shadow:0 4px 12px rgba(255,138,101,0.3)">📖 阅读全文</a>
</div>
{{#if unsubscribeUrl}}
<hr style="border:none;border-top:1px dashed #ffcc80;margin:24px 0" />
<p style="color:#a1887f;font-size:12px;text-align:center;margin:0">
  不再想收到此类邮件？<a href="{{unsubscribeUrl}}" style="color:#ff7043;text-decoration:underline">取消订阅</a>
</p>
{{/if}}
