# TechMind Blog CI/CD Pipeline
stages:
  - test
  - build
  - deploy

# 变量配置
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG
  ADMIN_IMAGE: $CI_REGISTRY_IMAGE/admin:$CI_COMMIT_REF_SLUG

# Docker构建模板
.docker_build_template: &docker_build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

# ============ 测试阶段 ============

# 后端代码检查
backend_lint:
  stage: test
  image: node:22-alpine
  script:
    - cd backend
    - npm install
    - echo "Backend lint passed (add eslint later)"
  only:
    - main
    - develop
    - merge_requests

# 前端类型检查
frontend_typecheck:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm install
    - npm run build
  only:
    - main
    - develop
    - merge_requests

# 管理后台类型检查
admin_typecheck:
  stage: test
  image: node:22-alpine
  script:
    - cd admin
    - npm install
    - npm run build
  only:
    - main
    - develop
    - merge_requests

# ============ 构建阶段 ============

# 构建后端镜像
build_backend:
  <<: *docker_build
  stage: build
  script:
    - cd backend
    - docker build -t $BACKEND_IMAGE .
    - docker push $BACKEND_IMAGE
  only:
    - main
    - develop

# 构建前端镜像
build_frontend:
  <<: *docker_build
  stage: build
  script:
    - cd frontend
    - docker build -t $FRONTEND_IMAGE .
    - docker push $FRONTEND_IMAGE
  only:
    - main
    - develop

# 构建管理后台镜像
build_admin:
  <<: *docker_build
  stage: build
  script:
    - cd admin
    - docker build -t $ADMIN_IMAGE .
    - docker push $ADMIN_IMAGE
  only:
    - main
    - develop

# ============ 部署阶段 ============

# 开发环境部署
deploy_develop:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $BACKEND_IMAGE &&
        docker pull $FRONTEND_IMAGE &&
        docker pull $ADMIN_IMAGE &&
        docker-compose up -d --remove-orphans &&
        docker image prune -f
      "
  environment:
    name: development
  only:
    - develop

# 生产环境部署
deploy_production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $DEPLOY_HOST >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY &&
        docker pull $BACKEND_IMAGE &&
        docker pull $FRONTEND_IMAGE &&
        docker pull $ADMIN_IMAGE &&
        docker-compose up -d --remove-orphans &&
        docker image prune -f
      "
  environment:
    name: production
  when: manual
  only:
    - main
